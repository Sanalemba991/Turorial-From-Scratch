<!DOCTYPE html>
<html>

<head>
  <title>DOM Practice</title>

  <style>
    .red {
      color: red;
    }
  </style>
</head>

<body>

  <h1 id="title">My To-Do List</h1>

  <input id="taskInput" type="text" placeholder="Enter task">

  <button id="addBtn">Add Task</button>
  <button id="removeBtn">Remove Task</button>
  <button id="colorBtn">Change Color</button>
  <button id="toggleBtn">Toggle Red</button>

  <p id="message">No task added</p>

  <div id="container">
    <p class="text">First Task</p>
  </div>

  <script src="./ram.js"></script>

</body>

</html>
